name: SmartBus AI Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov flake8

      - name: Verify Python Syntax & Import Integrity
        run: |
          python -c "import app; print('App module imported successfully')"
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Database Initialization
        run: |
          python -c "from app import create_app, db; app = create_app();
          with app.app_context():
              db.create_all()
              print('Database tables verified successfully')
          "

      - name: Execute Automated Test Suite
        env:
          FLASK_ENV: testing
          TESTING: True
        run: |
          pytest tests/test_cloud_sync.py -v
